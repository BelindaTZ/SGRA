logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.support=TRACE
logging.level.org.postgresql=DEBUG


spring.application.name=SGRA01
spring.datasource.url=jdbc:postgresql://localhost:5432/SGRA01?currentSchema=sgra
spring.datasource.username=sgra_app
spring.datasource.password=#012345
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=sgra
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
app.cors.allowed-origins=http://localhost:4200,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174

jwt.secret=dev-secret-change-me-please-update
jwt.ttl-hours=8
