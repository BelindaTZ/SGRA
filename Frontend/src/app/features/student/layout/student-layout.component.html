<div class="student-shell">
  <aside class="student-sidebar">
    <div class="brand">
      <div class="logo-circle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 3 1 8l11 5 9-4.09V17h2V8L12 3zm-5 9v3c0 2.76 2.69 5 6 5s6-2.24 6-5v-3l-6 2.73L7 12z"
          />
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">SGRA</span>
        <span class="brand-subtitle">UTEQ</span>
      </div>
    </div>

    <nav class="menu">
      <a routerLink="/dashboard/estudiante" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" />
          </svg>
        </span>
        Dashboard
      </a>
      <a routerLink="/dashboard/estudiante/nueva-solicitud" routerLinkActive="active">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14m-7-7h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
          </svg>
        </span>
        Nueva Solicitud
      </a>
      <a routerLink="/dashboard/estudiante/mis-solicitudes" routerLinkActive="active">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h16v2H4z" />
          </svg>
        </span>
        Mis Solicitudes
      </a>
      <a routerLink="/dashboard/estudiante/historial" routerLinkActive="active">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13 3a9 9 0 1 0 8.94 10H20a7 7 0 1 1-2.05-4.95L15 11h6V5l-2.76 2.76A8.97 8.97 0 0 0 13 3zm-1 4h2v6l4 2-1 1.73-5-2.73V7z" />
          </svg>
        </span>
        Historial
      </a>
      <a routerLink="/dashboard/estudiante/preferencias" routerLinkActive="active">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.14 12.94a7.88 7.88 0 0 0 .06-.94 7.88 7.88 0 0 0-.06-.94l2.03-1.58-1.92-3.32-2.39.96a7.96 7.96 0 0 0-1.63-.94l-.36-2.54h-3.84l-.36 2.54a7.96 7.96 0 0 0-1.63.94l-2.39-.96-1.92 3.32 2.03 1.58a7.88 7.88 0 0 0-.06.94c0 .32.02.64.06.94l-2.03 1.58 1.92 3.32 2.39-.96c.5.4 1.05.73 1.63.94l.36 2.54h3.84l.36-2.54a7.96 7.96 0 0 0 1.63-.94l2.39.96 1.92-3.32-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z" />
          </svg>
        </span>
        Preferencias
      </a>
    </nav>

    <button class="logout" type="button" (click)="onLogout()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M16 13v-2H7V8l-5 4 5 4v-3h9zm3-10H9a2 2 0 0 0-2 2v3h2V5h10v14H9v-3H7v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z" />
      </svg>
      Cerrar sesión
    </button>
  </aside>

  <main class="student-main">
    <header class="student-topbar">
      <div class="topbar-left">
        <button class="menu-toggle" type="button" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <h1>{{ title }}</h1>
      </div>
      <div class="topbar-actions">
        <span class="icon-btn" aria-label="Notificaciones">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm6-6V11a6 6 0 0 0-12 0v5L4 18v1h16v-1l-2-2z" />
          </svg>
        </span>
        <span class="icon-btn" aria-label="Usuario">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4z" />
          </svg>
        </span>
      </div>
    </header>

    <section class="student-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
